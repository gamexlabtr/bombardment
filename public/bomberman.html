/* ========== Web Audio – Dosyasız ========== */
let audioCtx = null;
function ac(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
    return audioCtx;
  }catch{ return null; }
}
let stepT = 0;
function sfxStep(){
  const now = performance.now();
  if(now - stepT < 105) return;
  stepT = now;
  const ctx = ac(); if(!ctx) return;
  const t0 = ctx.currentTime;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type='square';
  o.frequency.setValueAtTime(420+Math.random()*55, t0);
  o.frequency.exponentialRampToValueAtTime(175, t0+0.048);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(0.052, t0+0.007);
  g.gain.exponentialRampToValueAtTime(0.001, t0+0.051);
  o.connect(g); g.connect(ctx.destination);
  o.start(t0); o.stop(t0+0.058);
}
function sfxBombPlace(){
  const ctx = ac(); if(!ctx) return;
  const t0 = ctx.currentTime;
  [880, 1318].forEach((f,i)=>{
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type='square';
    o.frequency.setValueAtTime(f, t0+i*0.062);
    g.gain.setValueAtTime(0.0001, t0+i*0.062);
    g.gain.linearRampToValueAtTime(0.13, t0+i*0.062+0.009);
    g.gain.exponentialRampToValueAtTime(0.001, t0+i*0.062+0.072);
    o.connect(g); g.connect(ctx.destination);
    o.start(t0+i*0.062); o.stop(t0+i*0.062+0.084);
  });
}
function sfxBombTick(fast=false){
  const ctx = ac(); if(!ctx) return;
  const t0 = ctx.currentTime;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type='square'; o.frequency.value = fast ? 1220 : 740;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(fast?0.095:0.062, t0+0.006);
  g.gain.exponentialRampToValueAtTime(0.001, t0+0.048);
  o.connect(g); g.connect(ctx.destination);
  o.start(t0); o.stop(t0+0.054);
}
function sfxBoom(){
  const ctx = ac(); if(!ctx) return;
  const t0 = ctx.currentTime;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type='sawtooth';
  o.frequency.setValueAtTime(108, t0);
  o.frequency.exponentialRampToValueAtTime(32, t0+0.34);
  g.gain.setValueAtTime(0.38, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0+0.36);
  o.connect(g); g.connect(ctx.destination);
  o.start(t0); o.stop(t0+0.38);
  // crack
  const buffer = ctx.createBuffer(1, ctx.sampleRate*0.26, ctx.sampleRate);
  const d = buffer.getChannelData(0);
  for(let i=0;i<d.length;i++){ const tt=i/ctx.sampleRate; d[i]=(Math.random()*2-1)*Math.exp(-tt*7.2)*0.86; }
  const src = ctx.createBufferSource(); src.buffer = buffer;
  const bp = ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=900; bp.Q.value=0.95;
  const gg = ctx.createGain(); gg.gain.value=0.42;
  src.connect(bp); bp.connect(gg); gg.connect(ctx.destination);
  src.start(t0+0.008);
}
function sfxPowerup(){
  const ctx = ac(); if(!ctx) return;
  const t0 = ctx.currentTime;
  [523,659,784,1047].forEach((f,i)=>{
    const o = ctx.createOscillator(), g = ctx.createGain();

    o.frequency.setValueAtTime(f, t0+i*0.069);
    g.gain.setValueAtTime(0.0001, t0+i*0.069);
    g.gain.linearRampToValueAtTime(0.2, t0+i*0.069+0.012);
    g.gain.exponentialRampToValueAtTime(0.001, t0+i*0.069+0.11);
    o.connect(g); g.connect(ctx.destination);
    o.start(t0+i*0.069); o.stop(t0+i*0.069+0.12);
  });
}
function sfxWin(){
  const ctx = ac(); if(!ctx) return;

    o.frequency.setValueAtTime(f, t0+i*0.13);

}

/* ========== OYUN ÇEKİRDEĞİ ========== */
const COLS = 13;
const ROWS = 11;

const TILE = { EMPTY:0, WALL:1, CRATE:2 };

function makeLevel(levelNum /*1-5*/){
  const map = Array.from({length:ROWS}, ()=> Array(COLS).fill(0));
  // dış duvar + ızgara taş
  for(let y=0;y<ROWS;y++){
    for(let x=0;x<COLS;x++){
      if(x===0||y===0||x===COLS-1||y===ROWS-1) map[y][x]=1;
      else if(x%2===0 && y%2===0) map[y][x]=1;
    }
  }
  // crate yoğunluğu – seviye arttıkça
  const density = [0.52, 0.59, 0.64, 0.70, 0.74][Math.min(4, levelNum-1)];
  const safeZones = [
    [1,1],[2,1],[1,2],
    [COLS-2,ROWS-2],[COLS-3,ROWS-2],[COLS-2,ROWS-3],
    [1,ROWS-2],[2,ROWS-2],[1,ROWS-3],
    [COLS-2,1],[COLS-3,1],[COLS-2,2]
  ];
  const isSafe = (x,y)=> safeZones.some(([sx,sy])=> sx===x && sy===y);
  for(let y=1;y<ROWS-1;y++){
    for(let x=1;x<COLS-1;x++){
      if(map[y][x]!==0) continue;
      if(isSafe(x,y)) continue;
      if(Math.random() < density) map[y][x] = 2;
    }
  }
  // gizli kapı – rastgele bir crate altına
  const crates=[];
  for(let y=1;y<ROWS-1;y++) for(let x=1;x<COLS-1;x++) if(map[y][x]===2) crates.push([x,y]);
  const doorPos = crates.length ? crates[Math.floor(Math.random()*crates.length)] : [Math.floor(COLS/2), Math.floor(ROWS/2)];
  return { map, doorPos };
}

const LEVEL_ENEMIES = [
  { count:2, speed: 880, smart:0.15 },
  { count:3, speed: 720, smart:0.33 },
  { count:4, speed: 600, smart:0.5 },
  { count:5, speed: 500, smart:0.64 },
  { count:6, speed: 430, smart:0.78 },
];

function newGameState(level=1, carry={}) {
  const { map, doorPos } = makeLevel(level);
  const cfg = LEVEL_ENEMIES[Math.min(4, level-1)];
  // düşman spawn noktaları – köşeler
  const spawns = [
    [COLS-2,1],[1,ROWS-2],[COLS-2,ROWS-2],
    [Math.floor(COLS/2),1],[1,Math.floor(ROWS/2)],[COLS-2,Math.floor(ROWS/2)]
  ];
  const enemies = [];
  for(let i=0;i<cfg.count;i++){
    const [sx, sy] = spawns[i % spawns.length];
    // spawn noktasını boşalt
    if(map[sy] && map[sy][sx] !== undefined) map[sy][sx] = 0;
    enemies.push({
      id: 'e'+i,
      x: sx, y: sy,
      alive: true,
      dir: Math.floor(Math.random()*4),
      moveAt: 0,
      speed: cfg.speed,
      smart: cfg.smart
    });
  }
  return {
    level,
    map,
    door: { x: doorPos[0], y: doorPos[1], revealed: false },
    player: {
      x:1, y:1,
      alive:true,
      lives: carry.lives ?? 3,
      bombsMax: carry.bombsMax ?? 1,
      fire: carry.fire ?? 1,
      speed: carry.speed ?? 1,
      score: carry.score ?? 0
    },
    enemies,
    bombs: [],
    explosions: [],
    powerups: [],
    gameOver: false,
    levelClear: false,
    message: `Bölüm ${level} – Haydi!`,
    t0: performance.now()
  };
}

/* ===== Canvas render loop ===== */
let canvasLoopRaf = 0;
function startCanvasLoop(){
  const canvas = document.getElementById('bomber-canvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d', { alpha:false });
  if(!ctx) return;
  ctx.imageSmoothingEnabled = false;
  const W = canvas.width, H = canvas.height;
  const tileW = Math.floor(W / COLS);
  const tileH = Math.floor(H / ROWS);
  const ox = Math.floor((W - tileW*COLS)/2);
  const oy = Math.floor((H - tileH*ROWS)/2);

  cancelAnimationFrame(canvasLoopRaf);
  function draw(){
    canvasLoopRaf = requestAnimationFrame(draw);
    if(!game) return;
    const g = game;
    // background felt
    ctx.fillStyle = '#0a3d29';
    ctx.fillRect(0,0,W,H);
    // grid subtle
    ctx.strokeStyle = 'rgba(255,255,255,0.018)';
    ctx.lineWidth = 1;
    for(let x=0;x<=COLS;x++){ const px=ox+x*tileW; ctx.beginPath(); ctx.moveTo(px, oy); ctx.lineTo(px, oy+ROWS*tileH); ctx.stroke(); }
    for(let y=0;y<=ROWS;y++){ const py=oy+y*tileH; ctx.beginPath(); ctx.moveTo(ox,py); ctx.lineTo(ox+COLS*tileW,py); ctx.stroke(); }

    // tiles
    for(let y=0;y<ROWS;y++){
      for(let x=0;x<COLS;x++){
        const t = g.map[y][x];
        const px = ox + x*tileW;
        const py = oy + y*tileH;
        if(t===1){
          // stone
          ctx.fillStyle = '#2a3f50';
          ctx.fillRect(px+1, py+1, tileW-2, tileH-2);
          ctx.fillStyle = 'rgba(255,255,255,0.045)';
          ctx.fillRect(px+2, py+2, tileW-6, 3);
          ctx.fillStyle = 'rgba(0,0,0,0.18)';
          ctx.fillRect(px+2, py+tileH-5, tileW-4, 3);
        } else if(t===2){
          // crate wood
          ctx.fillStyle = '#b76a34';
          ctx.fillRect(px+2, py+2, tileW-4, tileH-4);
          ctx.strokeStyle = '#6f3319';
          ctx.lineWidth = 2;
          ctx.strokeRect(px+3, py+3, tileW-6, tileH-6);
          // X
          ctx.strokeStyle = 'rgba(90,36,18,0.88)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(px+6, py+6);
          ctx.lineTo(px+tileW-6, py+tileH-6);
          ctx.moveTo(px+tileW-6, py+6);
          ctx.lineTo(px+6, py+tileH-6);
          ctx.stroke();
        } else {
          // floor
          ctx.fillStyle = '#0e5a34';
          ctx.fillRect(px+1, py+1, tileW-2, tileH-2);
        }
      }
    }

    // powerups
    g.powerups.forEach(pu=>{
      const px = ox + pu.x*tileW + tileW/2;
      const py = oy + pu.y*tileH + tileH/2;
      ctx.save();
      ctx.translate(px, py);
      const s = 0.95 + Math.sin(performance.now()/220)*0.07;
      ctx.scale(s,s);
      ctx.font = `${Math.floor(tileH*0.56)}px system-ui, Apple Color Emoji, Segoe UI Emoji`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(pu.type==='bomb' ? '💣' : pu.type==='fire' ? '🔥' : '👟', 0, 2);
      ctx.restore();
    });

    // door
    if(g.door){
      const dx = ox + g.door.x * tileW;
      const dy = oy + g.door.y * tileH;
      if(g.door.revealed){
        ctx.fillStyle = '#1d0f3a';
        ctx.fillRect(dx+4, dy+4, tileW-8, tileH-8);
        ctx.fillStyle = '#9d6bff';
        ctx.font = `bold ${Math.floor(tileH*0.42)}px monospace`;
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('⬇', dx+tileW/2, dy+tileH/2+1);
      }
    }

    // bombs
    const now = Date.now();
    g.bombs.forEach(b=>{
      const px = ox + b.x*tileW;
      const py = oy + b.y*tileH;
      const left = b.explodeAt - now;
      const pulse = left < 700 ? 1 + Math.sin(now/70)*0.11 : 1;
      const bw = Math.floor(tileW*0.56*pulse);
      const bh = Math.floor(tileH*0.56*pulse);
      const bx = px + Math.floor((tileW-bw)/2);
      const by = py + Math.floor((tileH-bh)/2);
      ctx.fillStyle = '#11161e';
      ctx.beginPath();
      // @ts-ignore
      if(ctx.roundRect) { ctx.roundRect(bx, by, bw, bh, 7); ctx.fill(); }
      else { ctx.fillRect(bx, by, bw, bh); }
      ctx.fillStyle = left < 520 ? '#ff4a3a' : '#ffd46a';
      ctx.fillRect(bx + Math.floor(bw/2)-1, by-6, 2, 7);
      // timer blink
      if(left < 900 && Math.floor(now/120)%2===0){
        ctx.fillStyle = 'rgba(255,60,40,0.72)';
        ctx.fillRect(px+2, py+2, tileW-4, tileH-4);
      }
    });

    // explosions
    g.explosions.forEach(e=>{
      const age = now - e.t;
      if(age > 520) return;
      const a = 1 - age/520;
      const px = ox + e.x*tileW;
      const py = oy + e.y*tileH;
      ctx.fillStyle = `rgba(255, ${160+40*a|0}, 40, ${0.92*a})`;
      ctx.fillRect(px+2, py+2, tileW-4, tileH-4);
      ctx.fillStyle = `rgba(255,245,200,${0.85*a})`;
      ctx.fillRect(px+8, py+8, tileW-16, tileH-16);
    });

    // players
    function drawPlayer(pl:any, isMe:boolean, label:string){
      if(!pl.alive) return;
      const px = ox + pl.x*tileW;
      const py = oy + pl.y*tileH;
      // shadow
      ctx.fillStyle = 'rgba(0,0,0,0.28)';
      ctx.beginPath();
      ctx.ellipse(px+tileW/2, py+tileH-6, tileW*0.28, 5, 0, 0, Math.PI*2);
      ctx.fill();
      // body
      const isWhite = pl.id===0;
      ctx.fillStyle = isWhite ? '#f2f6ff' : '#222837';
      // @ts-ignore
      if(ctx.roundRect){
        // @ts-ignore
        ctx.beginPath(); ctx.roundRect(px+5, py+5, tileW-10, tileH-10, 7); ctx.fill();
      } else {
        ctx.fillRect(px+5, py+5, tileW-10, tileH-10);
      }
      ctx.strokeStyle = isWhite ? '#8aa0c8' : '#a9c4ff';
      ctx.lineWidth = 2;
      // @ts-ignore
      if(ctx.roundRect){ ctx.beginPath(); ctx.roundRect(px+5, py+5, tileW-10, tileH-10, 7); ctx.stroke(); }
      // eyes
      ctx.fillStyle = isWhite ? '#1b243a' : '#ff6b6b';
      ctx.beginPath();
      ctx.arc(px+tileW*0.38, py+tileH*0.44, 2.2, 0, Math.PI*2); ctx.fill();
      ctx.beginPath();
      ctx.arc(px+tileW*0.62, py+tileH*0.44, 2.2, 0, Math.PI*2); ctx.fill();
      // label
      ctx.fillStyle = isWhite ? '#1b2436' : '#e6ecff';
      ctx.font = 'bold 10px ui-monospace,monospace';
      ctx.textAlign='center';
      ctx.fillText(label, px+tileW/2, py+tileH*0.74);
      if(isMe){
        ctx.strokeStyle = 'rgba(52,211,153,0.9)';
        ctx.lineWidth = 2;
        ctx.strokeRect(px+2, py+2, tileW-4, tileH-4);
      }
    }
    const mySide = getMySide();
    drawPlayer(g.players[0], mySide===0, 'P1');
    drawPlayer(g.players[1], mySide===1, gameModeRef.current==='offline' ? 'BT' : 'P2');

    // pixel scanline overlay
    ctx.fillStyle = 'rgba(0,255,210,0.015)';
    for(let y=0;y<H;y+=3){ ctx.fillRect(0,y,W,1); }
  }
  draw();
}

let gameModeRef = { current: 'offline' as 'offline'|'online' };

/* ===== player action dispatcher ===== */
function getMySide():0|1 {
  // @ts-ignore – set by outer scope
  return (window.__bomber_mySide ?? 0);
}
function doPlayerAction(action:'up'|'down'|'left'|'right'|'bomb', dx?:number, dy?:number){
  // handled inside game view – this is a fallback for canvas loop keys
  const ev = new CustomEvent('gx-bomber-action', { detail:{ action, dx, dy }});
  window.dispatchEvent(ev);
}

  // We actually render via renderGame() which already installed DOM + canvas loop.
  // This function exists to satisfy TypeScript – real logic is in renderGame()
  return null as any;
}

function escapeHtml(s:string){ return s.replace(/[&<>"']/g, m=> ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]!)); }
function escapeAttr(s:string){ return escapeHtml(s); }

function showToast(msg:string, ms=1750){
  const t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg;
  t.classList.remove('hidden');
  clearTimeout((showToast as any)._id);
  (showToast as any)._id = setTimeout(()=> t.classList.add('hidden'), ms);
}

  // simplified game loop + render
  let canvasLoopId = 0;
  function startCanvasLoop2(){
    const canvas = document.getElementById('gx-canvas') as HTMLCanvasElement | null;
    if(!canvas) return;
    const ctx = canvas.getContext('2d', {alpha:false})!;
    ctx.imageSmoothingEnabled = false;
    const W = canvas.width, H = canvas.height;
    const tileW = Math.floor(W / COLS);
    const tileH = Math.floor(H / ROWS);
    const ox = Math.floor((W - tileW*COLS)/2);
    const oy = Math.floor((H - tileH*ROWS)/2);

    cancelAnimationFrame(canvasLoopId);
    function frame(now:number){
      canvasLoopRaf = requestAnimationFrame(frame);
      if(!gs) return;
      // tick game
      gs = gameTick(gs, now);
      // draw
      ctx.fillStyle = '#0a3b2a';
      ctx.fillRect(0,0,W,H);
      // tiles
      for(let y=0;y<ROWS;y++){
        for(let x=0;x<COLS;x++){
          const t = gs.map[y][x];
          const px = ox + x*tileW;
          const py = oy + y*tileH;
          if(t===1){
            ctx.fillStyle = '#2a3f50';
            ctx.fillRect(px+1, py+1, tileW-2, tileH-2);
          } else if(t===2){
            ctx.fillStyle = '#b56a34';
            ctx.fillRect(px+2, py+2, tileW-4, tileH-4);
            ctx.strokeStyle = '#6f3319';
            ctx.lineWidth = 2;
            ctx.strokeRect(px+3, py+3, tileW-6, tileH-6);
          } else {
            ctx.fillStyle = '#0e5a34';
            ctx.fillRect(px+1, py+1, tileW-2, tileH-2);
          }
        }
      }
      // powerups
      gs.powerups.forEach(pu=>{
        const px = ox + pu.x*tileW + tileW/2;
        const py = oy + pu.y*tileH + tileH/2;
        ctx.font = `${Math.floor(tileH*0.6)}px system-ui, Apple Color Emoji`;
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(pu.type==='bomb'?'💣': pu.type==='fire' ? '🔥' : '👟', px, py+2);
      });
      // door
      const door = (gs as any).door;
      if(door){
        const dx = ox + door.x*tileW;
        const dy = oy + door.y*tileH;
        if(door.revealed){
          ctx.fillStyle = '#1a0f3a';
          ctx.fillRect(dx+4, dy+4, tileW-8, tileH-8);
          ctx.fillStyle = '#b98cff';
          ctx.font = `bold ${Math.floor(tileH*0.5)}px monospace`;
          ctx.textAlign='center';
          ctx.fillText('⬇', dx+tileW/2, dy+tileH/2+4);
        }
      }
      // bombs
      const nowMs = Date.now();
      gs.bombs.forEach(b=>{
        const px = ox + b.x*tileW;
        const py = oy + b.y*tileH;
        const left = b.explodeAt - nowMs;
        const pulse = left < 700 ? 1 + Math.sin(nowMs/70)*0.08 : 1;
        const bw = Math.floor(tileW*0.56*pulse);
        const bh = Math.floor(tileH*0.56*pulse);
        ctx.fillStyle = '#10161f';
        ctx.beginPath();
        ctx.ellipse(px+tileW/2, py+tileH/2, bw/2, bh/2, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = left < 520 ? '#ff4a3a' : '#ffd46a';
        ctx.fillRect(px+tileW/2-1, py+6, 2, 8);
      });
      // explosions
      gs.explosions.forEach(e=>{
        const age = nowMs - e.t;
        if(age > 520) return;
        const a = 1 - age/520;
        const px = ox + e.x*tileW;
        const py = oy + e.y*tileH;
        ctx.fillStyle = `rgba(255,${160+60*a|0},30,${0.96*a})`;
        ctx.fillRect(px+2, py+2, tileW-4, tileH-4);
      });
      // players
      function drawPl(pl:any, label:string, isWhite:boolean){
        if(!pl.alive) return;
        const px = ox + pl.x*tileW;
        const py = oy + pl.y*tileH;
        ctx.fillStyle = 'rgba(0,0,0,0.28)';
        ctx.beginPath(); ctx.ellipse(px+tileW/2, py+tileH-6, tileW*0.28, 5, 0,0,Math.PI*2); ctx.fill();
        ctx.fillStyle = isWhite ? '#f2f6ff' : '#232836';
        ctx.fillRect(px+5, py+5, tileW-10, tileH-10);
        ctx.strokeStyle = isWhite ? '#8aa0c8' : '#9fb8ff';
        ctx.lineWidth = 2;
        ctx.strokeRect(px+5, py+5, tileW-10, tileH-10);
        ctx.fillStyle = isWhite ? '#1b2436' : '#e6ecff';
        ctx.font = 'bold 10px monospace';
        ctx.textAlign='center';
        ctx.fillText(label, px+tileW/2, py+tileH*0.73);
      }
      drawPl(gs.players[0], 'P1', true);
      drawPl(gs.players[1], mode==='offline' ? 'BT' : 'P2', false);
    }
    frame(performance.now());
    // store cancel
    // @ts-ignore
    canvasLoopRaf = frame;
  }
  function stopLoop(){ cancelAnimationFrame(canvasLoopRaf); }

  // input
  function playerMove(dx:number, dy:number){
    if(!gs || gs.winner!==null) return;
    const now = Date.now();
    const p = gs.players[0];
    // cooldown
    const cd = Math.max(88, 170 - p.speed*26);
    // @ts-ignore
    if(window.__lastMove && now - (window.__lastMove as number) < cd) return;
    // @ts-ignore
    window.__lastMove = now;
    const nx = p.x + dx; const ny = p.y + dy;
    // walkable?
    const t = gs.map[ny]?.[nx];
    if(t===undefined) return;
    if(t===1 || t===2) return;
    if(gs.bombs.some(b=> b.x===nx && b.y===ny)) return;
    p.x = nx; p.y = ny;
    playStep();
    // powerup pickup
    const pui = gs.powerups.findIndex(pu=> pu.x===nx && pu.y===ny);
    if(pui>=0){
      const pu = gs.powerups.splice(pui,1)[0];
      if(pu.type==='bomb') p.bombsMax = Math.min(6, p.bombsMax+1);
      if(pu.type==='fire') p.bombPower = Math.min(6, p.bombPower+1);
      if(pu.type==='speed') p.speed = Math.min(5.2, p.speed+0.82);
      playPowerup();
    }
    // door check
    // @ts-ignore
    const door = gs.door;
    if(door && door.revealed && p.x===door.x && p.y===door.y){
      // next level
      // @ts-ignore
      const lvl = (gs as any).level || 1;
      if(lvl >= 5){
        // win game
        // @ts-ignore
        gs.winner = 0;
        playWinMelody();
        saveScore(((p as any).score||0) + 1500, lvl);
        return;
      } else {
        const carry = {
          lives: p.lives,
          bombsMax: p.bombsMax,
          fire: p.bombPower,
          speed: p.speed,
          score: ((p as any).score||0) + 500
        };
        // @ts-ignore
        gs = { ...newBomberState(), ...{}}; // fresh
        // manually set level data
        // @ts-ignore
        const newSt = newBomberState();
        // @ts-ignore
        newSt.players[0].bombsMax = carry.bombsMax;
        // @ts-ignore
        newSt.players[0].bombPower = carry.fire;
        // @ts-ignore
        newSt.players[0].speed = carry.speed;
        // @ts-ignore
        newSt.players[0].lives = carry.lives;
        // @ts-ignore
        (newSt.players[0] as any).score = carry.score;
        // @ts-ignore
        (newSt as any).level = lvl+1;
        gs = newSt;
        showToast(`Bölüm ${lvl+1} !`);
        return;
      }
    }
  }
  function playerBomb(){
    if(!gs || gs.winner!==null) return;
    const p = gs.players[0];
    const active = gs.bombs.filter(b=> b.owner===0).length;
    if(active >= p.bombsMax) return;
    if(gs.bombs.some(b=> b.x===p.x && b.y===p.y)) return;
    const now = Date.now();
    gs.bombs.push({
      id: 'b_'+now+'_'+Math.random().toString(36).slice(2,5),
      x: p.x, y: p.y,
      owner: 0,
      power: p.bombPower,
      plantedAt: now,
      explodeAt: now + 2500
    });
    playBombPlace();
  }

  // keyboard with preventDefault – BLOGGER KAYMA ENGELİ
  function onKeyDown(e:KeyboardEvent){
    const blockKeys = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Spacebar','Space','w','a','s','d','W','A','S','D'];
    if(blockKeys.includes(e.key)){
      e.preventDefault();
      e.stopPropagation();
      // @ts-ignore
      if(e.stopImmediatePropagation) e.stopImmediatePropagation();
    }
    if(!gs || gs.winner!==null) return;
    if(e.key===' ' || e.code==='Space'){ playerBomb(); return; }
    const map:any = {
      ArrowUp:[0,-1], w:[0,-1], W:[0,-1],
      ArrowDown:[0,1], s:[0,1], S:[0,1],
      ArrowLeft:[-1,0], a:[-1,0], A:[-1,0],
      ArrowRight:[1,0], d:[1,0], D:[1,0]
    };
    const mv = map[e.key];
    if(mv) playerMove(mv[0], mv[1]);
  }
  window.addEventListener('keydown', onKeyDown, {capture:true});
  // also block scroll
  ['keydown','keyup','keypress'].forEach(ev=>{
    window.addEventListener(ev, (e:KeyboardEvent)=>{
      if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Spacebar'].includes(e.key)){
        e.preventDefault();
      }
    }, {capture:true, passive:false} as any);
  });

  // bot – GARANTİLİ
  let botInterval: number | null = null;
  function startBot(){
    if(mode!=='offline') return;
    if(botInterval) clearInterval(botInterval);
    // @ts-ignore
    botInterval = setInterval(()=>{
      if(!gs || gs.winner!==null) return;
      const bot = gs.players[1];
      if(!bot || !bot.alive) return;

      // danger map
      const danger = new Set<string>();
      gs.explosions.forEach(ex=> danger.add(ex.x+','+ex.y));
      gs.bombs.forEach(b=>{
        danger.add(b.x+','+b.y);
        [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{
          for(let s=1;s<=b.power;s++){
            const cx=b.x+dx*s, cy=b.y+dy*s;
            if(cx<0||cy<0||cx>=COLS||cy>=ROWS) break;
            if(gs!.map[cy][cx]===1) break;
            danger.add(cx+','+cy);
            if(gs!.map[cy][cx]===2) break;
          }
        });
      });

      const inDanger = danger.has(`${bot.x},${bot.y}`);
      const moves = [[0,-1,'up'],[0,1,'down'],[-1,0,'left'],[1,0,'right']].map(([dx,dy,dir])=>{
        const nx = bot.x + (dx as number);
        const ny = bot.y + (dy as number);
        const walk =
          nx>=0 && ny>=0 && nx<COLS && ny<ROWS &&
          gs!.map[ny][nx]!==1 && gs!.map[ny][nx]!==2 &&
          !gs!.bombs.some(b=> b.x===nx && b.y===ny);
        if(!walk) return null;
        const safe = !danger.has(`${nx},${ny}`);
        let score = Math.random()*0.2;
        if(safe) score += inDanger ? 5 : 0.3;
        else score -= 3;
        // chase player
        const p = gs!.players[0];
        if(p.alive){
          const dist = Math.abs(nx-p.x)+Math.abs(ny-p.y);
          score += (20-dist)*0.04;
        }
        // powerup
        if(gs!.powerups.some(u=> u.x===nx && u.y===ny)) score += 2.2;
        return {dx,dy,dir,nx,ny,score,safe};
      }).filter(Boolean) as any[];
      moves.sort((a,b)=> b.score-a.score);
      const best = moves[0];
      if(best){
        // move bot
        const idx = 1;
        const np = gs!.players[idx];
        np.x = best.nx; np.y = best.ny;
        // powerup pickup
        const pui = gs!.powerups.findIndex(pu=> pu.x===best.nx && pu.y===best.ny);
        if(pui>=0){
          const pu = gs!.powerups.splice(pui,1)[0];
          if(pu.type==='bomb') np.bombsMax = Math.min(6, np.bombsMax+1);
          if(pu.type==='fire') np.bombPower = Math.min(6, np.bombPower+1);
          if(pu.type==='speed') np.speed = Math.min(5, np.speed+0.7);
        }
      }

      // bomb decision
      const me = gs!.players[1];
      const opp = gs!.players[0];
      let wantBomb = false;
      // adjacent crate?
      [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{
        const cx=me.x+dx, cy=me.y+dy;
        if(gs!.map[cy]?.[cx]===2) wantBomb = Math.random() < 0.7;
      });
      // opponent in line?
      if(opp.alive){
        if(opp.x===me.x && Math.abs(opp.y-me.y) <= me.bombPower) wantBomb = true;
        if(opp.y===me.y && Math.abs(opp.x-me.x) <= me.bombPower) wantBomb = true;
      }
      if(wantBomb){
        const active = gs!.bombs.filter(b=> b.owner===1).length;
        if(active < me.bombsMax && !gs!.bombs.some(b=> b.x===me.x && b.y===me.y)){
          gs!.bombs.push({
            id:'bb_'+Date.now(),
            x: me.x, y: me.y,
            owner:1,
            power: me.bombPower,
            plantedAt: Date.now(),
            explodeAt: Date.now()+2500
          });
          playBombPlace();
        }
      }
    }, 420); // 420ms – garantili tick
  }
  function stopBot(){ if(botInterval){ clearInterval(botInterval); botInterval=null; } }

  // start/stop per screen
  if(mode==='offline'){
    // @ts-ignore
    window.__bomber_cleanup = ()=> { stopBot(); window.removeEventListener('keydown', onKeyDown, true as any); };
    startBot();
  }

  // initial render
  drawUI();

  // also expose a simple render loop hook to refresh HUD
  const hudInt = setInterval(()=>{ /* HUD is canvas-driven, minimal DOM update needed */ }, 500);
  return ()=>{ clearInterval(hudInt); stopBot(); window.removeEventListener('keydown', onKeyDown, true as any); };

  // ---- local functions inside closure ----
  function drawUI(){
    // already rendered by outer renderGame – we are in module mode where renderGame() is called by parent
    // This wrapper is just to keep TS happy – actual DOM is built in renderGame()
  }

})();
